name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Workflows match their source
        run: npm run check
      - name: Database (as the restricted bot role)
        run: npm run test:db

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker pull n8nio/n8n:2.40.7 && docker pull pgvector/pgvector:pg17
      - name: Gate → n8n → Postgres with mocked Meta + Claude
        run: npm run test:e2e
